<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecterComs - Tactical Comms</title>
    <!-- Body stays transparent for the transparent window's custom shape/shadow.
         The #root pre-render below fills the viewport from the very first paint frame
         so the OS window chrome never floats over an empty transparent body. -->
    <style>html,body{background:transparent!important;margin:0;padding:0}</style>
  </head>
  <body>
    <!-- Pre-React splash: child div is replaced when React mounts.
         IMPORTANT: styles must be on the inner div, NOT on #root — React replaces
         children but preserves #root's attributes, so any style on #root would
         persist and break the app layout after mount. -->
    <div id="root"><div style="position:fixed;inset:0;background:#030a13;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;">
      <div style="font-family:monospace;font-size:24px;font-weight:bold;letter-spacing:0.3em;color:#22d3ee;">SPECTERCOMS</div>
      <div style="font-family:monospace;font-size:11px;letter-spacing:0.2em;color:#0891b2;">INITIALIZING...</div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
