[package]
name = "mls-crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
openmls = { version = "0.8", features = ["js"] }
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
openmls_basic_credential = "0.5"
tls_codec = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = "1"
