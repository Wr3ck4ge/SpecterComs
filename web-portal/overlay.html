<!doctype html>
<html lang="en" class="specter-overlay-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecterComs Overlay</title>
    <!-- External stylesheet, not an inline <style> tag or style="" attribute —
         Tauri's runtime CSP nonce silently blocks inline styles the app
         authors itself (see splash.css's header comment). -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body class="specter-overlay-body">
    <!-- Visible before ANY JS runs. overlay.jsx hides this after React mounts. -->
    <div id="overlay-boot-status" class="specter-overlay-boot-status">⬛ OVERLAY LOADING...</div>
    <div id="overlay-root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('overlay-boot-status');
        if (el) { el.style.background='#7f1d1d'; el.style.color='#fca5a5'; el.textContent = 'UNCAUGHT: ' + msg + ' (' + src + ':' + line + ')'; }
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('overlay-boot-status');
        if (el) { el.style.background='#7f1d1d'; el.style.color='#fca5a5'; el.textContent = 'UNHANDLED REJECTION: ' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)); }
      };
    </script>
    <script type="module" src="/src/overlay.jsx"></script>
  </body>
</html>
