[default]
description = "Allows access to all specter-audio plugin commands"
permissions = [
    "allow-list-audio-devices",
    "allow-list-output-devices",
    "allow-start-capture",
    "allow-stop-capture",
    "allow-play-frame",
    "allow-set-output-device",
    "allow-set-send-threshold",
    "allow-set-vad-config",
    "allow-clear-stream",
    "allow-get-audio-pipeline-log",
    "allow-set-stream-volume",
    "allow-share-audio-start",
    "allow-share-audio-stop",
    "allow-share-audio-play-frame",
    "allow-share-audio-set-volume",
    "allow-share-audio-set-delay",
    "allow-share-audio-playback-stop",
]
