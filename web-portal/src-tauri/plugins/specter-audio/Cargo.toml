[package]
name = "tauri-plugin-specter-audio"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-specter-audio"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
cpal = "0.15"
audiopus = "0.3.0-rc.0"
parking_lot = "0.12"
base64 = "0.22"
rubato = "2.0.0"
dasp_interpolate = "0.11.0"
dasp_ring_buffer = "0.11.0"
dasp_signal = "0.11.0"
dasp_sample = "0.11.0"
