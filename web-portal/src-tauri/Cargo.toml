[package]
name = "app"
version = "1.10.3"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-updater = "2.10.0"
tauri-plugin-dialog = "2.6.0"
sysinfo = "0.36.1"
sha2 = "0.10.9"
aes-gcm = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-specter-audio = { path = "plugins/specter-audio" }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Storage_Xps",
  "Win32_Media",
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Registry",
] }
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling"] }

[features]
default = ["dev_perf"]
# Performance report feature — enabled by default so users can submit capture reports.
# To disable: set default = [] or remove the feature from the build command.
dev_perf = []

[lints.rust]
elided_lifetimes_in_paths = "allow"
unexpected_cfgs = "allow"
