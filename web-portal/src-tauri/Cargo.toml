[package]
name = "app"
version = "1.10.46"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-updater = "2.10.0"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.36.1"
sha2 = "0.10.9"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-specter-audio = { path = "plugins/specter-audio" }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-process = "2"
# Tray strip "Create account" opens https://spectercoms.net in the user's
# browser. The strip's capability scopes it to that site only.
tauri-plugin-opener = "2"
# Native build of the same crate the browser/webview uses via WASM (see
# web-portal/mls-crypto) — the core encrypt/decrypt/state logic has zero
# wasm-bindgen dependency, so this Rust process can decrypt MLS-encrypted
# channel messages directly (for the local message cache) without a WASM
# boundary or a JS runtime, which is what makes background sync possible when
# the webview itself is torn down (tray_light close mode).
mls-crypto = { path = "../mls-crypto" }
# HTTP + SSE client for the tray_light background sync task (background_sync.rs)
# — a headless Rust process with no webview can't use the browser's fetch/
# EventSource, so this replicates the same requests useEventStream.js/api.js
# make, from Rust instead.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync"] }
# Repair panel (netdiag.rs): a native QUIC handshake outside WebView2 and HMAC
# checks on the relay's UDP probe replies. All already in the tree via reqwest
# and openmls, so these add no new crates to the build.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
hmac = "0.12"
# Native WebTransport fallback (native_wt.rs): the relay's own crate and
# version (services/media-rust), so the HTTP/3 WebTransport draft matches
# exactly. It brings quinn 0.10 / rustls 0.21; rustls 0.21 is named here to
# restrict the ClientHello to one X25519 key share and to test its size.
wtransport = { version = "=0.1.14", default-features = false }
rustls021 = { package = "rustls", version = "0.21", default-features = false, features = ["quic"] }

[dev-dependencies]
# Interop tests run a real relay-crate server with a self-signed cert.
wtransport = { version = "=0.1.14", features = ["self-signed"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Storage_Xps",
  "Win32_Media",
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
] }
ffmpeg-next = { version = "8", default-features = false, features = ["codec", "format", "software-scaling"] }

[features]
default = ["dev_perf"]
# Performance report feature — enabled by default so users can submit capture reports.
# To disable: set default = [] or remove the feature from the build command.
dev_perf = []

[lints.rust]
elided_lifetimes_in_paths = "allow"
unexpected_cfgs = "allow"
