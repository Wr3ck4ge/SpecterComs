[package]
name = "media-sfu"
version = "0.1.4"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
anyhow = "1.0"
wtransport = "0.1.13" # WebTransport Support
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
jwt = "0.16.0"
hmac = "0.12.1"
sha2 = "0.10.8"

# Certificate Generation
rcgen = "0.13"
time = "0.3"
async-nats = "0.46.0"
bytes = "1.11.1"
futures = "0.3.32"
prost = "0.14.3"
prost-types = "0.14.3"
prost-build = "0.14.3"
audiopus = "0.3.0-rc.0"
urlencoding = "2.1.3"
sysinfo = "0.38.4"

[build-dependencies]
prost-build = "0.14.3"
